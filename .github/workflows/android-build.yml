name: Build AFK Gacha Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: afk-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # GameCI editor images and the Unity Editor are x86_64 Linux binaries.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout client and private Asset Store dependencies
        uses: actions/checkout@v4
        with:
          submodules: false

      # The public client repository omits paid / licensed Asset Store imports,
      # and client/ProjectSettings/ProjectSettings.asset is gitignored.
      # Populate AFK_ASSETS_ARCHIVE_BASE64 with a .tar.gz whose root contains
      # those restored directories and files. Keep it in a GitHub Secret.
      - name: Restore Unity project dependencies
        env:
          AFK_ASSETS_ARCHIVE_BASE64: ${{ secrets.AFK_ASSETS_ARCHIVE_BASE64 }}
        run: |
          if [ -z "$AFK_ASSETS_ARCHIVE_BASE64" ]; then
            echo "::error::AFK_ASSETS_ARCHIVE_BASE64 is required: restore Asset Store imports and ProjectSettings.asset first."
            exit 1
          fi
          printf '%s' "$AFK_ASSETS_ARCHIVE_BASE64" | base64 --decode > "$RUNNER_TEMP/afk-assets.tar.gz"
          tar -xzf "$RUNNER_TEMP/afk-assets.tar.gz" -C client
          rm -f "$RUNNER_TEMP/afk-assets.tar.gz"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: client/Library
          key: afk-library-${{ runner.os }}-2021.3.26f1-${{ hashFiles('client/Packages/manifest.json') }}
          restore-keys: |
            afk-library-${{ runner.os }}-2021.3.26f1-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: 2021.3.26f1
          targetPlatform: Android
          buildMethod: AfkAndroidBuild.Build
          buildsPath: build
          buildName: AFKGacha
          androidExportType: androidPackage
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          # Restoring the private archive changes the checkout after checkout.
          allowDirtyBuild: true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AFKGacha-Android
          path: |
            build/**/*.apk
          if-no-files-found: error
