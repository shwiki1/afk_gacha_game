name: Build AFK Gacha Android APK

on:
  # Run manually after the Unity and project dependency secrets are configured.
  workflow_dispatch:

concurrency:
  group: afk-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # GameCI editor images and the Unity Editor are x86_64 Linux binaries.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          submodules: false

      # Licensed Asset Store files are optional for the first public-source
      # build. When a private asset repository is configured, restore it here.
      - name: Restore optional private Unity assets
        env:
          AFK_ASSETS_REPO: ${{ secrets.AFK_ASSETS_REPO }}
          AFK_ASSETS_TOKEN: ${{ secrets.AFK_ASSETS_TOKEN }}
        run: |
          if [ -z "$AFK_ASSETS_REPO" ] || [ -z "$AFK_ASSETS_TOKEN" ]; then
            echo "::notice::No private asset repository configured; using the public client checkout."
            exit 0
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$AFK_ASSETS_TOKEN" | base64 -w0)"
          git clone --depth 1 --branch main \
            "https://github.com/$AFK_ASSETS_REPO.git" .afk-private-assets
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 AFK_ASSETS_TOKEN
          test -f .afk-private-assets/ProjectSettings/ProjectSettings.asset
          test -d .afk-private-assets/Assets/ThirdParty
          rsync -a .afk-private-assets/Assets/ client/Assets/
          install -Dm644 \
            .afk-private-assets/ProjectSettings/ProjectSettings.asset \
            client/ProjectSettings/ProjectSettings.asset

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: client/Library
          key: afk-library-${{ runner.os }}-2021.3.26f1-${{ hashFiles('client/Packages/manifest.json') }}
          restore-keys: |
            afk-library-${{ runner.os }}-2021.3.26f1-

      - name: Build APK
        uses: game-ci/unity-builder@v6
        env:
          # Current GameCI CLI acquires a Unity Personal seat directly from
          # the account. No legacy .ulf secret is needed for Personal mode.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          # Match the checked-in project and its URP 12.1.11 package. The
          # previous 2022.3 override produced a runtime URP NRE on Android.
          unityVersion: 2021.3.26f1
          targetPlatform: Android
          buildMethod: AfkAndroidBuild.Build
          buildsPath: build
          buildName: AFKGacha
          androidExportType: androidPackage
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          # Restoring the private archive changes the checkout after checkout.
          allowDirtyBuild: true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AFKGacha-Android
          path: |
            build/**/*.apk
          if-no-files-found: error
